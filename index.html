<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SPEXTRUM Control Tower</title>
<style>
:root{
  --bg:#F5F6F5; --surface:#FFFFFF; --ink:#17211E; --sub:#5C6864; --line:#E3E7E5;
  --brand:#0E5748; --brand-soft:#E4EFEB; --brand-ink:#0A3D33;
  --ok:#1B7A4E; --ok-bg:#E4F2EA; --danger:#C4442A; --danger-bg:#FAE8E3;
  --amber:#A9750F; --amber-bg:#F8EFD9; --gray:#6B7570; --gray-bg:#EEF0EF;
  --blue:#2B5FA3; --blue-bg:#E6EDF7;
  --r:10px; --shadow:0 1px 2px rgba(23,33,30,.05),0 4px 14px rgba(23,33,30,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ── layout ── */
#app{display:flex;min-height:100vh}
aside#side{width:196px;flex:0 0 196px;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
#side .logo{font-weight:800;font-size:15px;letter-spacing:.04em;padding:4px 10px 2px;color:var(--brand-ink)}
#side .logo small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.14em;color:var(--sub);margin-top:1px}
#side nav{margin-top:10px;display:flex;flex-direction:column;gap:2px}
#side .navgrp,#sheet .navgrp{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--sub);opacity:.75;padding:14px 10px 4px;text-transform:uppercase}
#side .navgrp:first-child{padding-top:4px}
#side nav button{display:flex;align-items:center;gap:9px;text-align:left;padding:8px 10px;border-radius:8px;color:var(--sub);font-weight:600;font-size:13.5px}
#side nav button.on{background:var(--brand-soft);color:var(--brand-ink)}
#side nav button:hover{background:var(--gray-bg)}
#side nav button.on:hover{background:var(--brand-soft)}
#side .foot{margin-top:auto;padding:8px 10px;font-size:11px;color:var(--sub)}
main{flex:1;min-width:0;padding:20px 22px 90px;max-width:1180px}
h1.page{font-size:19px;font-weight:800}
.phead{position:relative;display:inline-flex;align-items:center;gap:7px;margin-bottom:14px}
.tip{flex:0 0 auto;width:17px;height:17px;border-radius:50%;background:var(--gray-bg);color:var(--sub);
  font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;cursor:help}
.tipbox{display:none;position:absolute;top:calc(100% + 7px);left:0;z-index:45;background:var(--ink);color:#fff;
  font-size:12px;font-weight:500;line-height:1.55;padding:9px 13px;border-radius:9px;max-width:min(440px,86vw);
  width:max-content;box-shadow:0 6px 20px rgba(23,33,30,.25)}
.tipbox b{color:#fff}
.tipbox::before{content:'';position:absolute;top:-5px;left:14px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
@media (hover:hover){.phead:hover .tipbox{display:block}}
.tip:focus{outline:2px solid var(--brand);outline-offset:1px}
.tip:focus~.tipbox{display:block}

/* ── status strip (signature) ── */
#strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--sub);box-shadow:var(--shadow)}
.chip b{font-size:14px;color:var(--ink)}
.chip.alert{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.chip.alert b{color:var(--danger)}
.chip.warn{border-color:#E4CE9C;background:var(--amber-bg);color:var(--amber)}
.chip.warn b{color:var(--amber)}

/* ── cards / tables ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card>.hd h2{font-size:14px;font-weight:800}
.card>.hd .sp{flex:1}
.card>.bd{padding:14px 16px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;color:var(--sub);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFA}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:#F6F9F8}
td.r,th.r{text-align:right}
tfoot td{font-weight:800;background:#FAFBFA}

/* ── badges ── */
.b{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b.g{background:var(--ok-bg);color:var(--ok)} .b.rd{background:var(--danger-bg);color:var(--danger)}
.b.a{background:var(--amber-bg);color:var(--amber)} .b.gy{background:var(--gray-bg);color:var(--gray)}
.b.bl{background:var(--blue-bg);color:var(--blue)}
.dd{font-weight:800}
.dd.over{color:var(--danger)} .dd.soon{color:var(--amber)}
.pri{display:inline-flex;width:20px;height:20px;border-radius:6px;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.pri.A{background:var(--danger-bg);color:var(--danger)}.pri.B{background:var(--blue-bg);color:var(--blue)}
.pri.C{background:var(--gray-bg);color:var(--gray)}.pri.D{background:var(--gray-bg);color:var(--gray)}

/* ── controls ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;font-weight:700;font-size:13px;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--gray-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.dangerous{background:var(--danger-bg);color:var(--danger)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;max-width:170px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--brand-soft);color:var(--brand-ink)}

/* ── modal ── */
#ovl{position:fixed;inset:0;background:rgba(20,28,25,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
#ovl.show{display:flex}
#modal{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px 26px}
@media(min-width:760px){#ovl{align-items:center}#modal{border-radius:14px;padding:22px;max-height:84vh}}
#modal h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center}
#modal h3 .x{margin-left:auto;color:var(--sub);font-size:20px;padding:2px 8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:11.5px;font-weight:700;color:var(--sub)}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#FAFBFA;font-size:13.5px;width:100%}
.f textarea{min-height:64px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;background:#fff}
.macts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.subsec{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.subsec h4{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:8px}
.mini{font-size:12.5px}
.mini li{list-style:none;padding:6px 0;border-bottom:1px dashed var(--line)}
.mini li:last-child{border-bottom:none}

/* ── mobile nav ── */
#tabs{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  z-index:50;padding-bottom:env(safe-area-inset-bottom)}
#tabs .row{display:flex}
#tabs button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--sub)}
#tabs button.on{color:var(--brand-ink)}
#tabs button .ic{font-size:17px;line-height:1}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:16px 16px 0 0;z-index:70;
  transform:translateY(105%);transition:transform .22s ease;padding:14px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
#sheet.show{transform:none}
#sheetbg{position:fixed;inset:0;background:rgba(20,28,25,.35);z-index:65;display:none}
#sheetbg.show{display:block}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
#sheet button.item{display:flex;width:100%;align-items:center;gap:10px;padding:12px 8px;border-radius:10px;font-weight:700;font-size:14px}
#sheet button.item:hover{background:var(--gray-bg)}
#sheet button.item small{margin-left:auto;color:var(--sub);font-weight:500;font-size:12px}

.empty{color:var(--sub);font-size:13px;padding:18px 6px;text-align:center}
.hint{font-size:11.5px;color:var(--sub)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.sync{position:fixed;right:12px;bottom:12px;z-index:80;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--sub);box-shadow:var(--shadow)}
.sync.ok{color:var(--ok);border-color:#BFDCCB}
.sync.wait{color:var(--amber)}
.sync.off{color:var(--danger);border-color:#E8B7AA;background:var(--danger-bg)}
@media(max-width:900px){.sync{bottom:calc(64px + env(safe-area-inset-bottom))}}
ul.notes{font-size:12.5px;color:var(--sub);padding-left:18px;display:flex;flex-direction:column;gap:4px}
.mtx{font-size:12px}
.mtx th{position:sticky;top:0}
.mtx th.name,.mtx td.name{position:sticky;left:0;background:var(--surface);z-index:2;font-weight:700;min-width:74px}
.mtx th.name{background:#FAFBFA;z-index:3}
.mtx input{width:46px;padding:3px 4px;border:1px solid transparent;border-radius:5px;text-align:right;background:transparent}
.mtx input:hover{border-color:var(--line);background:#FAFBFA}
.mtx input:focus{outline:2px solid var(--brand);outline-offset:-1px;background:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi .k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k .l{font-size:11.5px;color:var(--sub);font-weight:700}
.kpi .k .v{font-size:19px;font-weight:800;margin-top:2px}
.kpi .k.rd .v{color:var(--danger)} .kpi .k.am .v{color:var(--amber)} .kpi .k.gr .v{color:var(--ok)}

@media(max-width:900px){
  aside#side{display:none}
  #tabs{display:block}
  main{padding:16px 14px 96px}
  .fgrid{grid-template-columns:1fr}
  .filters select,.filters input[type=search]{max-width:none;flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="logo">SPEXTRUM<small>CONTROL TOWER</small></div>
    <nav id="pcnav"></nav>
    <div class="foot">데이터는 이 브라우저에만 저장됩니다.<br>정기적으로 <b>내보내기</b>로 백업하세요.</div>
  </aside>
  <main id="main"></main>
</div>

<div id="tabs"><div class="row" id="mbnav"></div></div>
<div id="sheetbg" onclick="closeSheet()"></div>
<div id="sheet"><div class="grab"></div><div id="sheetItems"></div></div>

<div id="ovl"><div id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="sync" class="sync" style="display:none">로컬 모드</div>

/* ── 동기화 엔진: 서버 우선 로드 + rev 검사 쓰기 (last-write-wins 차단) ── */
let syncTimer=null;
function scheduleSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(doSync, 700); }
function setStatus(txt, cls){ const el=document.getElementById('sync'); if(!el) return;
  el.textContent=txt; el.className='sync '+(cls||''); el.style.display=FIREBASE_CONFIG?'block':'none'; }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function fbBoot(){
  if(!FIREBASE_CONFIG) return;
  setStatus('서버 연결 중…','wait');
  loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js')
  .then(()=>loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'))
  .then(()=>{
    firebase.initializeApp(FIREBASE_CONFIG); fbdb=firebase.database();
    fbdb.ref('.info/connected').on('value',s=>{
      fbOnline=!!s.val();
      if(!fbOnline) setStatus('오프라인 — 지금 입력분은 복귀 후 저장','off');
      else { setStatus('온라인','ok'); if(dirty&&!conflicted) scheduleSync(); }
      renderOfflineBar();
    });
    return fbdb.ref(FB_PATH).get();
  })
  .then(snap=>{
    const v=snap&&snap.val();
    fbReady=true;
    const srvData = v && (v.json ? JSON.parse(v.json) : v.data);
    if(srvData){ // 서버가 정본
      DB=srvData; migrate(); baseRev=v.rev||0; dirty=false;
      try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){}
      render(); setStatus('온라인 · 서버 데이터 불러옴','ok');
    } else { // 서버 비어있음 → 최초 업로드
      dirty=true; doSync(); setStatus('온라인 · 최초 업로드','ok');
    }
  })
  .catch(e=>{ fbReady=false; setStatus('서버 연결 실패 — 로컬 모드','off'); });
}
function doSync(){
  if(!fbdb||!fbReady||conflicted) return;
  if(!fbOnline){ setStatus('오프라인 — 저장 대기','off'); return; }
  setStatus('저장 중…','wait');
  fbdb.ref(FB_PATH+'/rev').get().then(s=>{
    const srv=s.val()||0;
    if(srv!==baseRev){ conflicted=true; setStatus('⚠ 다른 기기 변경 감지','off'); conflictModal(srv); return; }
    const nr=baseRev+1;
    return fbdb.ref(FB_PATH).set({rev:nr, updatedAt:new Date().toISOString(), json:JSON.stringify(DB)})
      .then(()=>{ baseRev=nr; dirty=false;
        setStatus('저장됨 · '+new Date().toTimeString().slice(0,5),'ok'); });
  }).catch(e=>{ setStatus('저장 실패('+((e&&(e.code||e.message))||'?')+') — 재시도 대기','off'); setTimeout(()=>{ if(dirty) scheduleSync(); },4000); });
}
/* 창 복귀 시 서버 변경 확인: 내 수정 없으면 조용히 반영, 있으면 충돌 안내 */
function checkRemote(){
  if(!fbdb||!fbReady||!fbOnline||conflicted) return;
  fbdb.ref(FB_PATH+'/rev').get().then(s=>{
    const srv=s.val()||0;
    if(srv===baseRev) return;
    if(!dirty){
      fbdb.ref(FB_PATH).get().then(sn=>{ const v=sn.val();
        const sd=v&&(v.json?JSON.parse(v.json):v.data);
        if(sd){ DB=sd; migrate(); baseRev=v.rev||0;
          try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){}
          render(); toast('다른 기기의 변경을 반영했습니다'); } });
    } else { conflicted=true; conflictModal(srv); }
  }).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkRemote(); });
window.addEventListener('focus', checkRemote);

    <li><b>내 데이터로 덮어쓰기</b> — 다른 기기의 변경이 사라질 수 있습니다. 확실할 때만.</li>
  </ul>
  <div class="macts">
    <button class="btn dangerous" onclick="resolveConflict('mine',${srvRev||0})">내 데이터로 덮어쓰기</button>
    <button class="btn" onclick="resolveConflict('server')">서버 데이터 불러오기</button>
  </div>`, null);
}
function resolveConflict(which, srvRev){
  if(which==='server'){
    snapNow(true);
    fbdb.ref(FB_PATH).get().then(sn=>{ const v=sn.val();
      const sd=v&&(v.json?JSON.parse(v.json):v.data);
      if(sd){ DB=sd; migrate(); baseRev=v.rev||0; dirty=false; conflicted=false;
        try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){}
        closeModal(); render(); setStatus('온라인 · 서버 데이터 불러옴','ok'); toast('서버 데이터로 맞췄습니다'); } });
  } else {
    fbdb.ref(FB_PATH+'/rev').get().then(s=>{
      const nr=(s.val()||srvRev||0)+1;
      return fbdb.ref(FB_PATH).set({rev:nr, updatedAt:new Date().toISOString(), json:JSON.stringify(DB)})
        .then(()=>{ baseRev=nr; dirty=false; conflicted=false; closeModal();
          setStatus('저장됨 (덮어씀)','ok'); toast('내 데이터로 덮어썼습니다'); });
    });
  }
}

/* ═══════════ helpers ═══════════ */
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
const won = n => n||n===0 ? '₩'+Math.round(n).toLocaleString('ko-KR') : '';
const wonS = n => !n ? '-' : (Math.abs(n)>=100000000 ? (n/100000000).toFixed(1).replace(/\.0$/,'')+'억' : Math.abs(n)>=10000 ? Math.round(n/10000).toLocaleString()+'만' : n.toLocaleString());
const pct = v => (v*100).toFixed(1).replace(/\.0$/,'')+'%';
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
function dday(due){ if(!due) return null; const d=new Date(due+'T00:00:00'); if(isNaN(d)) return null; return Math.round((d-today0())/86400000); }
function ddayHtml(v){ if(v===null) return '<span class="hint">-</span>';
  const cls = v<0?'over':(v<=7?'soon':''); const label = v===0?'D-Day':(v<0?'D+'+(-v):'D-'+v);
  return `<span class="dd num ${cls}">${label}</span>`; }
const projOf = code => DB.projects.find(p=>p.code===code);
const pname = p => p ? (p.parent && p.sub ? p.parent+' / '+p.sub : (p.sub||p.parent||p.code)) : '';
const pnameByCode = code => { const p=projOf(code); return p?pname(p):code; };
function pageHead(t,d){ return `<div class="phead"><h1 class="page">${t}</h1>${d?`<button class="tip" aria-label="설명 보기">?</button><span class="tipbox">${d}</span>`:''}</div>`; }
function statusBadge(s){ const m={'진행중':'g','완료':'bl','위험':'rd','중단':'rd','취소':'gy','대기':'gy','보류':'gy','지연':'a'}; return `<span class="b ${m[s]||'gy'}">${esc(s||'-')}</span>`; }
function profBadge(s){ const m={'정상':'g','주의':'a','저마진':'a','적자':'rd','매출미입력':'gy'}; return `<span class="b ${m[s]||'gy'}">${esc(s)}</span>`; }
function uid(pre){ return pre+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function opt(list, sel){ return ['<option value=""></option>'].concat(list.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`)).join(''); }

/* ═══════════ 수익성 엔진 (원가센터 기준) ═══════════ */
function rateOf(name){ const r=DB.rates.find(x=>x.name===name && x.apply!=='미적용'); return r? (r.monthly||0):0; }
function profitInput(cc){
  let pi = DB.profitInputs.find(x=>x.cc===cc);
  if(!pi){ pi={cc, months:1, extBudget:0, reserveRate:0.1, purpose:'', memo:''}; DB.profitInputs.push(pi); }
  return pi;
}
/* 예산 라인: 원가센터 × 지출구분 */
function budgetsOf(cc){ return DB.budgets.filter(b=>b.cc===cc); }
function ccExtBudget(cc){ const bl=budgetsOf(cc);
  return bl.length ? bl.reduce((a,b)=>a+(+b.amount||0),0) : (profitInput(cc).extBudget||0); }
const isPaid = e => e.payState==='지급완료';
function ccExpenses(cc){ return DB.expenses.filter(e=>{ const p=projOf(e.code); return p&&p.cc===cc; }); }
/* 예산 대비 집행: 지출구분 라인별 예산/확정(전체 입력분)/지급(지급완료분) */
function budLines(cc){
  const map={};
  budgetsOf(cc).forEach(b=>{ const k=b.kind||'(구분없음)';
    (map[k]=map[k]||{kind:k,budget:0,committed:0,paid:0,memo:''}).budget+=(+b.amount||0);
    if(b.memo) map[k].memo=(map[k].memo?map[k].memo+' / ':'')+b.memo; });
  ccExpenses(cc).forEach(e=>{ const k=e.kind||'(구분없음)';
    const l=(map[k]=map[k]||{kind:k,budget:0,committed:0,paid:0,memo:''});
    l.committed+=(+e.amount||0); if(isPaid(e)) l.paid+=(+e.amount||0); });
  return Object.values(map);
}
function ccCalc(cc){
  const pi = profitInput(cc);
  const projs = DB.projects.filter(p=>p.cc===cc);
  const revenue = projs.reduce((a,p)=>a+(+p.revenue||0),0);
  const labor = DB.people.reduce((a,per)=>a + (per.alloc[cc]||0)*rateOf(per.name), 0) * (pi.months||1);
  const extBudget = ccExtBudget(cc);
  const reserve = extBudget*(pi.reserveRate||0);
  const totalBudget = extBudget+reserve+labor;
  const estMargin = revenue-totalBudget;                       // 계획마진
  const estRate = revenue>0 ? estMargin/revenue : 0;
  const exps = ccExpenses(cc);
  const committed = exps.reduce((a,e)=>a+(+e.amount||0),0);    // 확정액 (입력된 전체)
  const paid = exps.reduce((a,e)=>a+(isPaid(e)?+e.amount:0),0);// 지급완료분
  const actExt = committed;
  // 전망: 라인별로 확정이 예산을 넘으면 확정을, 아니면 예산을 쓴다 (미집행 예산 포함)
  const lines = budLines(cc);
  const fcExt = lines.reduce((a,l)=>a+Math.max(l.budget,l.committed),0);
  const fcMargin = revenue - labor - fcExt;                    // 전망마진
  const fcRate = revenue>0 ? fcMargin/revenue : 0;
  const actCost = labor+committed, actMargin = revenue-actCost;// 확정마진
  const actRate = revenue>0 ? actMargin/revenue : 0;
  const overLines = lines.filter(l=>l.budget>0 && l.committed>l.budget).length;
  let state;
  const th = DB.thresholds||{low:.1,warn:.25};
  if(revenue<=0) state='매출미입력';
  else if(estRate<0) state='적자';
  else if(estRate<th.low) state='저마진';
  else if(estRate<th.warn) state='주의';
  else state='정상';
  return {cc, pi, count:projs.length, revenue, labor, extBudget, reserve, totalBudget, estMargin, estRate,
    committed, paid, fcExt, fcMargin, fcRate, actExt, actCost, actMargin, actRate, lines, overLines, state};
}
function allCC(){
  const set = new Set(DB.ccList);
  DB.projects.forEach(p=>{ if(p.cc && p.cc!=='-') set.add(p.cc); });
  return [...set];
}
function projProf(p){ return p.cc && p.cc!=='-' ? ccCalc(p.cc) : null; }

/* 재무 자동 */
function finCalc(f){ const paid=(+f.adv||0)+(+f.mid||0)+(+f.bal||0); return {paid, due:(+f.total||0)-paid}; }
/* 인력 자동 */
function personCalc(per){ const t=Object.values(per.alloc).reduce((a,v)=>a+(+v||0),0);
  return {total:t, rest:+(1-t).toFixed(2), state: t>1.001?'과부하':(t<0.9?'여유':'적정')}; }

function stripHtml(){
  const all=DB.projects, run=all.filter(p=>p.status==='진행중'), risk=all.filter(p=>p.status==='위험');

/* 주간 계획 모드: 프로젝트를 훑으며 옆에 바로 적는다 */

  const prevWeeks = [...new Set(DB.weekly.map(w=>w.week).filter(w=>w&&w<week))].sort().reverse();

  // 정렬: 위험 → D-Day 임박 → 우선순위
  projs = [...projs].sort((a,b)=>{
    const ra=(a.status==='위험'?0:1)-(b.status==='위험'?0:1); if(ra) return ra;
    const da=dday(a.due), db_=dday(b.due);
    const dv=(da===null?9999:da)-(db_===null?9999:db_); if(dv) return dv;
    return (a.pri||'Z').localeCompare(b.pri||'Z'); });
  const entryOf = code => DB.weekly.find(w=>w.week===week && w.code===code);
  const carry = DB.weekly.filter(w=>w.week===prevWeek && w.status!=='완료' && w.todo && w.code);
  const owners=[...new Set(DB.projects.map(p=>p.owner).filter(o=>o&&o!=='-'))];
  const doneN = projs.filter(p=>{ const e=entryOf(p.code); return e&&e.todo.trim(); }).length;
  return `${pageHead(`주간 계획 · ${esc(week)} 주`,`프로젝트를 위에서부터 훑으면서, 이번 주 할 일을 오른쪽에 바로 적으세요. 칸을 벗어나면 자동 저장됩니다.`)}

    <select onchange="wf.owner=this.value;render()"><option value="">Owner 전체</option>${owners.map(o=>`<option ${wf.owner===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
    <span style="flex:1"></span><span class="chip"><b class="num">${doneN}</b>/ ${projs.length} 작성</span>
  </div>
  ${carry.length?`<div class="card"><div class="hd"><h2>지난주(${esc(prevWeek)}) 미완료 — 이어서 하기</h2></div>
  <div class="tw"><table><tbody>${carry.map(w=>{ const p=projOf(w.code); const already=entryOf(w.code);
    return `<tr><td style="width:180px"><b>${esc(p?pname(p):w.code)}</b></td><td class="mini">${nl(w.todo)}</td>
    <td style="width:110px;text-align:right">${already&&already.todo.trim()?'<span class="hint">작성됨</span>':`<button class="btn ghost sm" onclick="carryOver('${w.id}')">이번 주로 →</button>`}</td></tr>`; }).join('')}
  </tbody></table></div></div>`:''}
  <div class="card"><div class="tw"><table><thead><tr>
  <th style="min-width:170px">프로젝트</th><th>지금 상황 (읽기용)</th><th style="min-width:260px;width:38%">이번 주 할 일 ✍</th></tr></thead><tbody>
  ${projs.map(p=>{ const e=entryOf(p.code); const prev=DB.weekly.find(w=>w.week===prevWeek&&w.code===p.code);
    const ctx=[
      p.stage&&('단계 '+p.stage), p.due&&('마감 '+p.due),
      p.milestone&&('◇ '+p.milestone), p.action&&('이번 달: '+p.action),
      p.decision&&('결정필요: '+p.decision), p.risk&&('⛔ '+p.risk),
      prev&&prev.todo&&('지난주: '+prev.todo+(prev.status==='완료'?' ✓':' (미완)'))
    ].filter(Boolean);
    return `<tr>
    <td><b>${esc(pname(p))}</b><div class="hint">${esc(p.owner||'-')} · ${statusBadge(p.status)} ${p.due?ddayHtml(dday(p.due)):''}</div></td>
    <td class="mini" style="color:var(--sub)">${ctx.map(nl).join('<br>')||'<span class="hint">-</span>'}</td>
    <td><textarea data-plancode="${esc(p.code)}" placeholder="이번 주에 할 일…"
      style="width:100%;min-height:56px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:${e&&e.todo.trim()?'#FAFBFA':'#FFFDF5'};font-size:13px;resize:vertical"

      ${e&&e.due?`<div class="hint num" style="margin-top:2px">마감 ${esc(e.due)}</div>`:''}</td></tr>`; }).join('')}
  </tbody></table></div></div>
  <p class="hint">저장 규칙: 내용을 적으면 해당 주차 액션이 생기고, 비우면 삭제됩니다. 마감·막힌 점 등 세부는 보드에서 행을 눌러 편집.</p>`;
}
function planSave(code, ta){
  const week=wf.planWeek||mondayOf(new Date());
  const val=ta.value.trim();
  let e=DB.weekly.find(w=>w.week===week&&w.code===code);
  if(val){
    if(e){ if(e.todo===val) return; e.todo=val; }
    else { e={id:uid('w'),week,code,todo:val,due:'',status:'예정',blocked:'',doneAt:'',next:''}; DB.weekly.push(e); }
    ta.style.background='#FAFBFA'; save(); toast('저장됨 · '+pnameByCode(code));
  } else if(e && !val){
    DB.weekly=DB.weekly.filter(w=>w!==e); ta.style.background='#FFFDF5'; save(); toast('비워서 삭제됨');
  }
}
function carryOver(prevId){
  const prev=DB.weekly.find(w=>w.id===prevId); if(!prev) return;
  const week=wf.planWeek||mondayOf(new Date());
  let e=DB.weekly.find(w=>w.week===week&&w.code===prev.code);
  if(e){ e.todo=(e.todo?e.todo+'\n':'')+prev.todo; }
  else DB.weekly.push({id:uid('w'),week,code:prev.code,todo:prev.todo,due:prev.due,status:'예정',blocked:prev.blocked,doneAt:'',next:''});
  save(); render(); toast('이번 주로 가져왔습니다');
}

function editBud(id, cc, kind){

    const g=id=>document.getElementById(id).value;
    if(!g('f_cc')){ toast('원가센터를 선택하세요'); return false; }
    Object.assign(b,{cc:g('f_cc'),kind:g('f_kind'),amount:+g('f_amt')||0,memo:g('f_memo')});

function editBudKind(cc, kind){
  const hits=DB.budgets.filter(b=>b.cc===cc&&(b.kind||'(구분없음)')===kind);

  openModal('예산 라인 · '+esc(cc)+' / '+esc(kind), `<ul class="mini">
  ${hits.map(b=>`<li>${won(b.amount)} ${b.memo?'· '+esc(b.memo):''}
   <button class="btn ghost sm" style="margin-left:8px" onclick="editBud('${b.id}')">편집</button></li>`).join('')}</ul>`, null);
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='spextrum_control_tower_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  URL.revokeObjectURL(a.href); toast('내보내기 완료');
}
function importJSON(input){
  const file=input.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
    if(!d.projects||!Array.isArray(d.projects)) throw 0;
    if(!confirm(`불러온 파일: 프로젝트 ${d.projects.length}건.\n현재 데이터를 이 파일로 교체할까요? (교체 전 스냅샷을 남깁니다)`)) return;
    snapNow(true); DB=d; save(); render(); toast('불러오기 완료');
  }catch(e){ toast('파일 형식이 올바르지 않습니다'); } };
  rd.readAsText(file); input.value='';
}
function snapNow(silent){
  try{ const snaps=JSON.parse(localStorage.getItem(SNAP_KEY)||'[]');
    snaps.unshift({d:new Date().toISOString().slice(0,10)+' (수동)', t:new Date().toISOString(), data:DB});
    while(snaps.length>10) snaps.pop();
    localStorage.setItem(SNAP_KEY, JSON.stringify(snaps));
    if(!silent){ toast('스냅샷 저장'); render(); } }catch(e){ toast('스냅샷 실패'); }
}
function restoreSnap(i){
  try{ const snaps=JSON.parse(localStorage.getItem(SNAP_KEY)||'[]');
    if(!snaps[i]) return;
    if(!confirm(snaps[i].d+' 시점으로 복원할까요? 현재 상태는 수동 스냅샷으로 남깁니다.')) return;
    snapNow(true); DB=structuredClone(snaps[i].data); save(); render(); toast('복원 완료'); }catch(e){}
}
function resetSeed(){
  if(!confirm('엑셀에서 가져온 원본 데이터로 되돌립니다.\n이후 수정한 내용은 사라집니다 (복원용 스냅샷은 남김). 진행할까요?')) return;
  snapNow(true); DB=structuredClone(SEED); save(); render(); toast('초기화 완료');
}

/* ═══════════ modal ═══════════ */
let modalSave=null;
function openModal(title, body, onSave, onDelete){
  modalSave=onSave;
  document.getElementById('modal').innerHTML=`<h3>${title}<button class="x" onclick="closeModal()">✕</button></h3>
  ${body}<div class="macts">
  ${onDelete?`<button class="btn dangerous" id="mdel">삭제</button>`:''}
  <button class="btn ghost" onclick="closeModal()">닫기</button>
  <button class="btn" onclick="if(modalSave&&modalSave()!==false)closeModal()">저장</button></div>`;
  if(onDelete) document.getElementById('mdel').onclick=onDelete;
  document.getElementById('ovl').classList.add('show');
}
function closeModal(){ document.getElementById('ovl').classList.remove('show'); modalSave=null; }
document.getElementById('ovl').addEventListener('click',e=>{ if(e.target.id==='ovl') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); closeSheet(); } });

render();
fbBoot();
setStatus(FIREBASE_CONFIG?"서버 연결 중…":"", "wait");
</script>
